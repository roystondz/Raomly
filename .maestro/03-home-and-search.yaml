# Demo stage 3: Home and Search, signed in.
appId: com.anonymous.roamly
---
- launchApp
- extendedWaitUntil:
    visible: "Find your next stay"
    timeout: 30000
# Home: category filter.
- tapOn: "Cabins"
- takeScreenshot: 03-home-cabins
- tapOn: "All Stays"
# Home prompt → Search.
- tapOn: "Describe your stay"
- inputText: "quiet pet friendly cabin with a hot tub under $300"
- tapOn: "Search stays"
- extendedWaitUntil:
    visible: "Cedar Hollow Cabin.*"
    timeout: 20000
- takeScreenshot: 03-search-results
# Turn the type chip off and on: a beach stay joins, then leaves again.
- tapOn: "Cabins"
- extendedWaitUntil:
    visible: "Surfside Bungalow.*"
    timeout: 15000
- takeScreenshot: 03-search-type-off
- tapOn: "Cabins"
- extendedWaitUntil:
    notVisible: "Surfside Bungalow.*"
    timeout: 15000
# Sort by lowest price through the action sheet.
- tapOn: "Sort by Best match"
- tapOn: "Lowest price"
- extendedWaitUntil:
    visible: "Sort by Lowest price"
    timeout: 5000
- takeScreenshot: 03-search-sorted
# Save the first result.
- tapOn:
    text: "Save stay"
    index: 0
- extendedWaitUntil:
    visible: "Remove from saved"
    timeout: 5000
# Clear: empty field, no chips, examples shown.
- tapOn: "Clear search"
- extendedWaitUntil:
    visible: "Describe your stay in one sentence"
    timeout: 5000
- takeScreenshot: 03-search-cleared
# No results.
- inputText: "villa under $100"
- pressKey: Enter
- extendedWaitUntil:
    visible: "No stays match"
    timeout: 15000
- takeScreenshot: 03-search-no-results
# A place with no stays.
- tapOn: "Clear search"
- inputText: "japan"
- pressKey: Enter
- extendedWaitUntil:
    visible: "No stays in Japan yet"
    timeout: 15000
- takeScreenshot: 03-search-japan
# Descriptive words only: no-match screen, then closest stays on request.
- tapOn: "Clear search"
- inputText: "igloo on the moon"
- pressKey: Enter
- extendedWaitUntil:
    visible: "We couldn't find an exact match"
    timeout: 15000
- takeScreenshot: 03-search-no-exact
- tapOn: "Show closest stays anyway"
- extendedWaitUntil:
    visible: "Closest matches"
    timeout: 5000
- takeScreenshot: 03-search-closest
