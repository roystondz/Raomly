# Demo stage 4: a stay's details, from Home, with saving synced to Search.
appId: com.anonymous.roamly
---
- launchApp
- extendedWaitUntil:
    visible: "Find your next stay"
    timeout: 30000
# Open the first featured stay from Home.
- tapOn: "Desert Modern Villa.*"
- extendedWaitUntil:
    visible: "Book this stay"
    timeout: 20000
- takeScreenshot: 04-details-top
# Swipe through photos.
- swipe:
    start: 80%, 25%
    end: 15%, 25%
- extendedWaitUntil:
    visible: "Photo 2 of 3"
    timeout: 5000
- takeScreenshot: 04-details-photo-2
# Save here; Search should show it saved too.
- tapOn: "Save stay"
- extendedWaitUntil:
    visible: "Remove from saved"
    timeout: 5000
# Book: coming-soon alert.
- tapOn: "Book this stay"
- extendedWaitUntil:
    visible: "Coming soon"
    timeout: 10000
- takeScreenshot: 04-book-alert
- tapOn: "OK"
# Share sheet opens, then close it.
- tapOn: "Share stay"
- extendedWaitUntil:
    visible: "Copy"
    timeout: 10000
- takeScreenshot: 04-share-sheet
- swipe:
    start: 50%, 40%
    end: 50%, 95%
- waitForAnimationToEnd
# Scroll to the policy rows and the host.
- scrollUntilVisible:
    element: "Your host"
    direction: DOWN
- takeScreenshot: 04-details-lower
- tapOn: ".*cancellation.*Full refund.*"
- extendedWaitUntil:
    visible: "Cancellation"
    timeout: 10000
- takeScreenshot: 04-cancellation-sheet
- swipe:
    start: 50%, 30%
    end: 50%, 95%
- waitForAnimationToEnd
- tapOn: "Hosted by.*"
- extendedWaitUntil:
    visible: "Hosting since.*"
    timeout: 10000
- takeScreenshot: 04-host-sheet
- swipe:
    start: 50%, 50%
    end: 50%, 98%
- waitForAnimationToEnd
# Back to Home, then Search for the same stay: its heart is filled.
- tapOn: "Back"
- tapOn: "Search"
- tapOn: "Describe your stay"
- inputText: "villa in Palm Springs"
- pressKey: Enter
- extendedWaitUntil:
    visible: "Desert Modern Villa.*"
    timeout: 15000
- assertVisible: "Remove from saved"
- takeScreenshot: 04-saved-synced-in-search
